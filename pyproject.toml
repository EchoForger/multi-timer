[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multitimer"
version = "0.3.0"
description = "一个轻巧、原生的 macOS 多路菜单栏倒计时器"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wuhaonan" }]
dependencies = [
    "pyobjc-core>=10",
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-UserNotifications>=10",
]

[project.scripts]
multitimer = "multitimer:main"

[tool.setuptools]
py-modules = ["multitimer"]
